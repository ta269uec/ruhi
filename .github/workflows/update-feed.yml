name: Update data feed

on:
  schedule:
    - cron: '0 12 * * *' # daily at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # TODO once a real feed exists: replace fetchSourceData() in
      # scripts/generate-feed.mjs, and add whatever API key it needs as a
      # repo secret, passed through here as an env var.
      - run: node scripts/generate-feed.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/slices.json
          git diff --cached --quiet || git commit -m "Update data feed as-of date"
          git push
