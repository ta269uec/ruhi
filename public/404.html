<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ruhi — Price in Perspective</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites, so a deep link (e.g.
      // /ruhi/slice/china) 404s on its own. This redirects it back through
      // index.html with the intended path encoded in the query string; the
      // matching script in index.html restores it before React Router mounts.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // "/ruhi" — bump if the repo name changes

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
